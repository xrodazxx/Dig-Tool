[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sitecheck"
version = "0.9.0"
description = "Offline terrain + context check of a chosen spot; builds a JSON report and prompt for any AI"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.8",
  "matplotlib>=3.7",
  "Pillow>=10",
  "requests>=2.28",
  "flask>=2.3",
]

[project.optional-dependencies]
# strongly recommended: any GeoTIFF/projection (national lidar is projected)
geo = ["rasterio>=1.3", "pyproj>=3.5"]       # any CRS, ArcticDEM, fast GLO-30
lidar = ["laspy[lazrs]>=2.4"]                 # LAS/LAZ point clouds
train = ["scikit-learn>=1.3"]                 # only for "sitecheck train" (retraining the spot model)

[project.scripts]
sitecheck = "sitecheck.cli:run"

[tool.setuptools]
packages = ["sitecheck", "sitecheck.fetch", "sitecheck.ui"]

[tool.setuptools.package-data]
sitecheck = ["weights.json", "model_pits.json", "ui/static/*"]
